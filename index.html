<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>
#gate { position: fixed; inset: 0; z-index: 9999; background: #fffaf2; display: grid; place-items: center; padding: 24px; font-family: "Zen Maru Gothic", sans-serif; color: #2f2a26; }
#gate form { display: flex; flex-direction: column; gap: 12px; width: min(340px, 100%); text-align: center; }
#gate img { width: 120px; margin: 0 auto; }
#gate input { font-size: 18px; padding: 12px 16px; border: 2px solid #e1622a; border-radius: 999px; text-align: center; }
#gate button, .dm-btn { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 18px; background: #e1622a; color: #fff; cursor: pointer; }
#gate small { color: #8a7d70; }
.dm-fab { position: fixed; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 60; box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: 13px; padding: 8px 14px !important; }
.dm-sheet { position: fixed; inset: 0; z-index: 70; background: rgba(20,20,20,.45); display: flex; align-items: flex-end; justify-content: center; }
.dm-card { background: #fffaf2; color: #2f2a26; width: min(560px, 100%); max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; font-family: "Zen Maru Gothic", sans-serif; }
.dm-card textarea { width: 100%; min-height: 96px; font: inherit; font-size: 16px; border: 2px solid #e8dccb; border-radius: 12px; padding: 8px 10px; }
.dm-card ul { margin: 0; padding-left: 18px; font-size: 13px; }
.dm-card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.dm-ghost { background: #f3e9db !important; color: #2f2a26 !important; }
.dm-banner { background: #2f2a26; color: #fff; font-size: 12px; text-align: center; padding: 4px 8px; }
</style>
<script>
/* ---- お試し版のしくみ（scripts/build_demo.py が足したもの） ---- */
(function () {
  const PASS = "3244ea5712cd87f164333bd902c74cdb6e4bc075abe036ae607a572f2452d8c0";
  const AI_URL = "https://filmo-ai-1.inaba-yorozu0.workers.dev";
  const getKey = () => { try { return localStorage.getItem("filmo-demo-key") || ""; } catch (e) { return ""; } };
  const ok = (() => { try { return localStorage.getItem("filmo-demo-pass") === PASS && (!AI_URL || !!getKey()); } catch (e) { return false; } })();
  async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t.trim())); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  if (!ok) document.addEventListener("DOMContentLoaded", () => {
    const g = document.createElement("div"); g.id = "gate";
    g.innerHTML = '<form><img src="anim/filmo.webp" alt=""><b>フィルモスタジオ（お試し版）</b><small>教えてもらった合言葉を入れてください</small><input type="password" autocomplete="off" aria-label="合言葉"><button type="submit">はじめる</button><small id="gateMsg"></small></form>';
    document.body.appendChild(g);
    g.querySelector("form").addEventListener("submit", async e => { e.preventDefault();
      if (await sha(g.querySelector("input").value) === PASS) { try { localStorage.setItem("filmo-demo-pass", PASS); localStorage.setItem("filmo-demo-key", g.querySelector("input").value.trim()); } catch (err) {} g.remove(); }
      else g.querySelector("#gateMsg").textContent = "合言葉がちがいます"; });
  });

  /* 起きたこと・エラーのメモ（使いづらいところと一緒に送る） */
  const LOGK = "filmo-demo-log", NOTEK = "filmo-demo-notes";
  const load = k => { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) { return []; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v.slice(-60))); } catch (e) {} };
  const where = () => { try { return `${state.view}${state.view === "make" ? "/" + (state.makeMode || "easy") + "/" + (state.makeTheme || "") : ""}`; } catch (e) { return "?"; } };
  const now = () => new Date().toLocaleString("ja-JP");
  window.__demoLog = (kind, text) => { const l = load(LOGK); l.push({ at: now(), kind, where: where(), text: String(text).slice(0, 300) }); put(LOGK, l); };
  addEventListener("error", e => __demoLog("エラー", (e.message || "") + (e.filename ? ` (${String(e.filename).split("/").pop()}:${e.lineno})` : "")));
  addEventListener("unhandledrejection", e => __demoLog("エラー", (e.reason && (e.reason.message || e.reason)) || "promise"));
  document.addEventListener("click", e => { const b = e.target.closest("button, [data-view], label"); if (b && !b.closest(".dm-card")) { const t = (b.textContent || "").trim().slice(0, 24); if (t) __demoLog("押した", t); } }, true);
  const device = () => `${navigator.userAgent}\n画面 ${screen.width}×${screen.height}・表示 ${innerWidth}×${innerHeight}・${matchMedia("(prefers-color-scheme: dark)").matches ? "ダーク" : "ライト"}`;

  function sheet() {
    const notes = load(NOTEK), errs = load(LOGK).filter(x => x.kind === "エラー");
    const s = document.createElement("div"); s.className = "dm-sheet";
    s.innerHTML = `<div class="dm-card" role="dialog" aria-label="使いづらいところを書く"><b>使いづらいところを書く</b>
      <small>どの画面で、何をしたら、どうなったか。「ここがわかりにくい」だけでもOKです。いまの画面（${where()}）も一緒に記録します。</small>
      <textarea id="dmText" placeholder="例：動画作成で「見てみる」を押したけど、何も出てこない"></textarea>
      <div class="row"><button class="dm-btn" type="button" data-dm="add">書いたものを残す</button><button class="dm-btn dm-ghost" type="button" data-dm="close">閉じる</button></div>
      <b style="font-size:14px">残したもの（${notes.length}件）${errs.length ? `・自動で記録したエラー（${errs.length}件）` : ""}</b>
      <ul>${notes.map(n => `<li>${n.at}［${n.where}］${n.text.replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;")}</li>`).join("") || "<li>まだありません</li>"}</ul>
      <div class="row"><button class="dm-btn" type="button" data-dm="send">まとめて送る（LINEなど）</button><button class="dm-btn dm-ghost" type="button" data-dm="copy">コピーする</button><button class="dm-btn dm-ghost" type="button" data-dm="clear">送ったので消す</button></div>
      <small id="dmMsg"></small></div>`;
    document.body.appendChild(s);
    const text = () => ["【フィルモ お試し版の感想】", ...load(NOTEK).map((n, i) => `${i + 1}. ${n.at}［${n.where}］${n.text}`),
      "", "【自動の記録（最後の30件）】", ...load(LOGK).slice(-30).map(x => `${x.at}［${x.where}］${x.kind}：${x.text}`), "", "【端末】", device()].join("\n");
    s.addEventListener("click", async e => {
      const a = (e.target.closest("[data-dm]") || {}).dataset?.dm; const msg = t => { s.querySelector("#dmMsg").textContent = t; };
      if (e.target === s || a === "close") s.remove();
      if (a === "add") { const v = s.querySelector("#dmText").value.trim(); if (!v) return msg("書いてから押してください");
        const n = load(NOTEK); n.push({ at: now(), where: where(), text: v }); put(NOTEK, n); s.remove(); sheet(); }
      if (a === "send") { try { if (navigator.share) { await navigator.share({ text: text() }); return; } } catch (err) { if (err && err.name === "AbortError") return; }
        try { await navigator.clipboard.writeText(text()); msg("コピーしました。LINEやメールに貼り付けて送ってください"); } catch (err) { msg("送れませんでした。「コピーする」を試してください"); } }
      if (a === "copy") { try { await navigator.clipboard.writeText(text()); msg("コピーしました。LINEやメールに貼り付けて送ってください"); }
        catch (err) { const ta = s.querySelector("#dmText"); ta.value = text(); ta.select(); msg("文字を選びました。長押しでコピーしてください"); } }
      if (a === "clear") { put(NOTEK, []); put(LOGK, []); s.remove(); sheet(); }
    });
  }
  document.addEventListener("DOMContentLoaded", () => {
    const b = document.createElement("button"); b.className = "dm-btn dm-fab"; b.type = "button"; b.textContent = "✎ 使いづらい所を書く";
    b.addEventListener("click", sheet); document.body.appendChild(b);
    const bn = document.createElement("div"); bn.className = "dm-banner"; bn.textContent = AI_URL ? "お試し版：作った動画・直した内容はこの端末だけに保存" : "お試し版：AIで作るは使えません・直した内容はこの端末だけに保存"; document.body.prepend(bn);
  });

  /* 保存先（db）：この端末の中だけ（localStorage） */
  const DBK = "filmo-demo-db";
  let store = {}; try { store = JSON.parse(localStorage.getItem(DBK) || "{}"); } catch (e) {}
  const save = () => { try { localStorage.setItem(DBK, JSON.stringify(store)); } catch (e) { __demoLog("エラー", "保存がいっぱい：" + e.message); } };
  const subs = {}, copy = d => JSON.parse(JSON.stringify(d));
  const snap = name => ({ docs: Object.entries(store[name] || {}).sort((a, b) => String(a[1].at || a[1].created || "").localeCompare(String(b[1].at || b[1].created || ""))).map(([id, d]) => ({ id, data: () => copy(d) })) });
  const fire = name => setTimeout(() => (subs[name] || []).forEach(f => { try { f(snap(name)); } catch (e) { __demoLog("エラー", e.message); } }), 0);
  const doc = (name, id) => ({ id,
    set: async d => { (store[name] = store[name] || {})[id] = copy(d); save(); fire(name); },
    update: async d => { (store[name] = store[name] || {})[id] = { ...(store[name][id] || {}), ...copy(d) }; save(); fire(name); },
    delete: async () => { if (store[name]) delete store[name][id]; save(); fire(name); },
    get: async () => ({ id, exists: !!(store[name] || {})[id], data: () => copy((store[name] || {})[id] || {}) }) });
  const coll = name => ({ orderBy() { return this; }, where() { return this; }, limit() { return this; },
    onSnapshot(fn) { (subs[name] = subs[name] || []).push(fn); setTimeout(() => fn(snap(name)), 0); return () => {}; },
    doc: id => doc(name, id), get: async () => snap(name),
    add: async d => { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await doc(name, id).set(d); return doc(name, id); } });

  /* 素材（assets）：この端末の中だけ（IndexedDB）。画面の /_blob/… をその場で差しかえる */
  const urls = {};
  const idb = new Promise(res => { try { const r = indexedDB.open("filmo-demo", 1); r.onupgradeneeded = () => r.result.createObjectStore("blobs"); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } });
  const idbPut = async (k, v) => { const d = await idb; if (!d) return; d.transaction("blobs", "readwrite").objectStore("blobs").put(v, k); };
  const idbGet = async k => { const d = await idb; if (!d) return null; return new Promise(res => { const r = d.transaction("blobs").objectStore("blobs").get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); };
  async function urlOf(id) { if (urls[id]) return urls[id]; const b = await idbGet(id); if (b) urls[id] = URL.createObjectURL(b); return urls[id] || ""; }
  const BL = /\/_blob\/([A-Za-z0-9_-]+)/;
  async function fix(el) {
    for (const at of ["src", "poster"]) { const v = el.getAttribute && el.getAttribute(at); const m = v && v.match(BL); if (m) { const u = await urlOf(m[1]); if (u && el.getAttribute(at) === v) el.setAttribute(at, u); } }
    const st = el.getAttribute && el.getAttribute("style"); const m = st && st.match(BL);
    if (m) { const u = await urlOf(m[1]); if (u) el.setAttribute("style", st.split("/_blob/" + m[1]).join(u)); }
  }
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "attributes") fix(m.target);
    m.addedNodes && m.addedNodes.forEach(n => { if (n.nodeType !== 1) return; fix(n); n.querySelectorAll('[src*="/_blob/"], [style*="/_blob/"], [poster*="/_blob/"]').forEach(fix); });
  })).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ["src", "style", "poster"] });
  const A = window.Audio; window.Audio = function (src) { const a = new A(); if (src) { const m = String(src).match(BL); if (m) urlOf(m[1]).then(u => { a.src = u; }); else a.src = src; } return a; };
  const assets = { upload: async f => {
    if (f.size > 20 * 1024 * 1024) throw { code: "too_large" };
    const id = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    urls[id] = URL.createObjectURL(f); idbPut(id, f);
    return { id, url: "/_blob/" + id, contentType: f.type || "application/octet-stream" }; } };

  /* AIで作る：中継役（Cloudflare Workers）に頼む。キーは中継役にだけある */
  const sample = AI_URL ? { json: async prompt => {
    let r;
    try { r = await fetch(AI_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pass: getKey(), prompt }) }); }
    catch (e) { __demoLog("エラー", "AIにつながらない：" + e.message); throw e; }
    const d = await r.json().catch(() => ({}));
    if (r.status === 403) throw { code: "not_granted" };
    if (!r.ok) { __demoLog("エラー", "AI " + r.status + " " + (d.error || "")); throw new Error(d.error || "ai_error"); }
    const t = String(d.text || ""), a = t.indexOf("{"), b = t.lastIndexOf("}");
    try { return JSON.parse(a >= 0 && b > a ? t.slice(a, b + 1) : t); } catch (e) { __demoLog("エラー", "AIの返事が読めない"); throw new Error("bad_json"); }
  } } : null;
  window.claude = { use: async name => name === "db" ? { collection: coll } : name === "assets" ? assets : name === "sample" ? sample : null };
})();
</script>

<title>フィルモスタジオ（お試し版）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=M+PLUS+Rounded+1c:wght@900&display=swap">
<style>
/* レイアウト：左にメニュー、右に作業面。スマホではメニューが上の横並びになる */
:root {
  /* フィルモとYOROZUの水彩に合わせる：あたたかい紙・墨色の文字・フィルモのオレンジ・タキシードの虹色は差し色だけ */
  --bg: #fffaf2;
  --surface: #ffffff;
  --sunken: #fff2e0;
  --ink: #2f2a26;
  --muted: #776b61;
  --line: #f0e2cc;
  --accent: #d9581c;
  --accent-soft: #ffe7d6;
  --leaf: #3e9b6b;
  --sun: #f2c94c;
  --rainbow: linear-gradient(90deg, #f6b91e, #f39a1b, #e2611f, #c45ab3, #2f80c9, #34afa6, #9cc63b);
  --price-bg: #ffe9ad;
  --price-ink: #5c4300;
  --good: #217a4b;
  --good-soft: #e1f3e8;
  --bad: #b0372b;
  --bad-soft: #fbe5e2;
  --warn-soft: #fff4dc;
  --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;   /* 丸い文字でやわらかく */
  --body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1916; --surface: #26211d; --sunken: #302923; --ink: #f3ece4; --muted: #b9ab9c; --line: #3d342c;
    --accent: #ff8a4c; --accent-soft: #43281a; --leaf: #6fd09a; --sun: #f2c94c; --price-bg: #4a3a10; --price-ink: #ffe3a0;
    --good: #6fd09a; --good-soft: #17352a; --bad: #f08a7e; --bad-soft: #3d1f1c; --warn-soft: #3a3020;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1916; --surface: #26211d; --sunken: #302923; --ink: #f3ece4; --muted: #b9ab9c; --line: #3d342c;
  --accent: #ff8a4c; --accent-soft: #43281a; --leaf: #6fd09a; --sun: #f2c94c; --price-bg: #4a3a10; --price-ink: #ffe3a0;
  --good: #6fd09a; --good-soft: #17352a; --bad: #f08a7e; --bad-soft: #3d1f1c; --warn-soft: #3a3020;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.7; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.35; text-wrap: balance; margin: 0; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; padding-inline: 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 8px; }
.brand b { font-family: var(--display); font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
.brand small { color: var(--muted); font-size: 12px; }
.shop { display: flex; flex-direction: column; gap: 4px; padding-inline: 8px; }
.shop label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.shop select { border: 1px solid var(--line); background: var(--sunken); border-radius: 8px; padding: 6px 8px; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button { white-space: nowrap; display: flex; align-items: center; gap: 10px; background: none; border: 0; text-align: left; padding: 9px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
nav button svg { width: 18px; height: 18px; flex: none; }
nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
nav button .dot { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 11px; display: grid; place-items: center; padding-inline: 5px; }
.proto-note { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px; border: 1px dashed var(--line); border-radius: 8px; }

main { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 1080px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.head h1 { font-size: 24px; }
.head p { margin: 0; color: var(--muted); font-size: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.panel h2 { font-size: 17px; margin-bottom: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 1px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.pill.price { background: var(--price-bg); color: var(--price-ink); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
mark { background: var(--price-bg); color: var(--price-ink); border-radius: 3px; padding: 0 2px; }

/* 動画作成 */
.themes { display: flex; flex-wrap: wrap; gap: 8px; }
.themes button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 500; }
.themes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.themes button:disabled { opacity: .45; cursor: not-allowed; }
.studio { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.phone { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 16px;
  max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }   /* 中身が長くても、この枠の中でなめらかにスクロール */
.phone > * { flex-shrink: 0; }   /* スクロールする枠の中で、動画の枠がつぶれないように */
.phone::-webkit-scrollbar { width: 8px; } .phone::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; } .phone::-webkit-scrollbar-track { background: transparent; }
/* 素材なしのアニメーション（1080×1920 で組んで、画面の幅に縮める） */
.an-box { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: #FFFEFA; }
.an-box video[hidden] { display: none; }
.an-box { cursor: pointer; }
.an-pause { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(47, 42, 38, .35); color: #fff; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
.an-pause small { font-weight: 500; } .an-pause .btn { text-shadow: none; }

/* 素材のプレビュー（本番の動画と同じ並び：素材をつなぎ、文字の場面を時間で等分） */
.pv { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: #111; max-width: 100%; }
.pv-media img, .pv-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: var(--pv-grade, brightness(1.04) contrast(1.06) saturate(1.15)); }
.pv-media img { transform: scale(1); transition: transform 3s linear; }
.pv-media img.zoom { transform: scale(1.1); }
/* Adrian Per の見本（10/27）：黄色の太い文字が1行ずつポンッと出る */
.pv-text { position: absolute; left: 5%; right: 5%; top: 42%; transform: translateY(-50%); text-align: center; font-family: "Dela Gothic One", var(--display);
  font-size: clamp(16px, 8cqw, 34px); line-height: 1.3; color: var(--pv-color, #FFD54A); overflow-wrap: anywhere; -webkit-text-stroke: 1px #1a1a1a; paint-order: stroke fill;
  text-shadow: 0 2px 0 #1a1a1a, 0 4px 10px rgba(0,0,0,.45); }
.pv-text span { display: block; animation: popIn .22s ease-out both; }
/* すっと出る文字（プリン・美容室・枕の見本）：真ん中・細いふち・下から少し上がる */
.pv-clean .pv-text { top: 50%; font-family: var(--body); font-weight: 700; font-size: clamp(14px, 6cqw, 26px); line-height: 1.5; -webkit-text-stroke: .6px #222; text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.35); }
.pv-clean .pv-text span { animation: riseIn .3s ease-out both; }
@keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes popIn { 0% { opacity: 0; transform: scale(.6); filter: blur(6px); } 70% { opacity: 1; transform: scale(1.12); filter: blur(0); } 100% { opacity: 1; transform: scale(1); } }
.pv-media .in-zoom { animation: inZoom .3s ease-out; }
.pv-media .in-slide { animation: inSlide .3s ease-out; }
.pv-media .in-turn { animation: inTurn .35s ease-out; }
@keyframes inZoom { from { transform: scale(1.3); filter: blur(8px); } to { transform: scale(1); filter: blur(0); } }
@keyframes inSlide { from { transform: translateX(40%); filter: blur(6px); } to { transform: translateX(0); filter: blur(0); } }
@keyframes inTurn { from { transform: rotate(-10deg) scale(1.25); filter: blur(4px); } to { transform: rotate(0) scale(1); filter: blur(0); } }

@keyframes pop { from { opacity: 0; transform: translateY(calc(-50% + 12px)); } to { opacity: 1; transform: translateY(-50%); } }
.pv { container-type: inline-size; }

/* カルテ＝もとの中身＋チャットからAIが入れた分 */
function karteNow(shop) {
  const s = shopData(shop);
  const karte = s.karte.map(r => [r[0], r[1], r[2], null, false]);   // 項目, 入手先, 内容, チャットで足した文, 手で直したか
  if (!karte.some(r => r[0] === "自由に作るで入れたこと")) karte.push(["自由に作るで入れたこと", "自由に作る", "", null, false]);   // いつも最後に置く（空でもよい）
  const services = s.services.map(r => [...r, false]);
  const prices = s.prices.map(r => [...r, false]);
  // チャットからの追加と、手で直した分を、起きた順に重ねる
  const events = [
    ...kupdates.filter(u => u.shop === shop).map(u => ({ at: u.at || "", u })),
    ...kedits.filter(e => e.shop === shop).map(e => ({ at: e.at || "", e })),
  ].sort((a, b) => a.at < b.at ? -1 : 1);
  for (const ev of events) {
    if (ev.u) {
      for (const f of ev.u.facts || []) {
        // 自由に作るで入れた情報は、専用の項目に（前に「お知らせ」に入れた分もここへ。2026-11-02 真由美さん）
        const item = /^free/.test(ev.u.topic || "") ? "自由に作るで入れたこと" : f.item;
        let row = karte.find(r => r[0] === item);
        if (!row) continue;
        row[2] = row[2] ? row[2] + "／" + f.text : f.text;
        row[1] = item === "自由に作るで入れたこと" ? "自由に作る" : "チャット";
        row[3] = (row[3] || []).concat(f.text);
      }
      for (const c of ev.u.services || []) { const sv = services.find(r => r[0] === c.name); if (sv) sv[1] = c.status; }
    } else {
      const e = ev.e;
      if (e.type === "item" && karte[e.idx]) { karte[e.idx][2] = e.text; karte[e.idx][1] = "手入力"; karte[e.idx][3] = null; karte[e.idx][4] = true; }
      if (e.type === "svc" && services[e.idx]) { services[e.idx][1] = e.status; services[e.idx][3] = true; }
      if (e.type === "price" && prices[e.idx]) { const p = prices[e.idx]; p[2] = e.amount; p[3] = e.regular; p[4] = e.remaining; p[5] = true; }
    }
  }
  const colorEdit = kedits.filter(e => e.shop === shop && e.type === "color").sort((a, b) => a.at < b.at ? -1 : 1).pop();
  // よくある質問：手で直した・足した・使わないにした分を重ねる（2026-11-06 真由美さん：全部載せて、自分で直せるように）
  const faqs = (s.faqs || []).map((f, i) => ({ ...f, key: "b" + i, edited: false }));
  for (const e of kedits.filter(e => e.shop === shop && (e.type === "faq" || e.type === "faq-add")).sort((a, b) => a.at < b.at ? -1 : 1)) {
    let f = faqs.find(x => x.key === e.key);
    if (!f && e.type === "faq-add") { f = { key: e.key, question: "", answer: "", added: true }; faqs.push(f); }
    if (!f) continue;
    Object.assign(f, { question: e.question ?? f.question, answer: e.answer ?? f.answer, off: !!e.off, edited: true });
  }
  return { ...s, karte, services, prices, faqsAll: faqs, faqs: faqs.filter(f => !f.off && f.question && f.answer).map(f => ({ question: f.question, answer: f.answer })), brandColor: colorEdit ? colorEdit.color : (s.brandColor || "") };
}

function appReply(c) {

居酒屋", "菓子", "ケーキ", "ラーメン", "食堂", "バー"]], ["beauty", ["美容", "サロン", "ネイル", "エステ", "まつ", "ヘア", "理容", "脱毛"]], ["body", ["整体", "整骨", "鍼", "マッサージ", "ヨガ", "ピラティス", "ジム", "治療院"]], ["school", ["教室", "スクール", "塾", "レッスン", "習い", "講座"]], ["creative", ["広告", "デザイン", "制作", "写真", "印刷", "映像"]]], "hints": {"food": {"target": "例：近所に住む子育て中の家族／仕事帰りに一人で寄る人", "faqs": "例：予約はできますか？→前日までお電話で／持ち帰りはできますか？", "pains": "例：子どもと入れるお店が少ない／一人でゆっくりできる店がない", "shooting": "例：焼き上がりの瞬間・湯気・カウンター越しの手元。お客様の顔は写さない", "strengths": "例：素材のこだわり・作り方・お店の居心地"}, "beauty": {"target": "例：髪のダメージに悩む30〜40代の女性", "faqs": "例：施術時間はどれくらい？／子ども連れでも大丈夫？", "pains": "例：子どもを預けられず美容院に行けない", "shooting": "例：施術の手元・仕上がり（お客様の許可あり）・店内の明るい席", "strengths": "例：技術・相談しやすさ・通いやすさ"}, "body": {"target": "例：デスクワークで肩こりがつらい30〜50代", "faqs": "例：1回で効果はありますか？／服装は？", "pains": "例：朝起きると腰が痛い／どこに行っても良くならない", "shooting": "例：施術の手元・院内・道具。体に触れる場面はお客様の許可をとる", "strengths": "例：説明のていねいさ・予約の取りやすさ・個室"}, "school": {"target": "例：小学生の子どもを持つ親／趣味を始めたい大人", "faqs": "例：体験はできますか？／初心者でも大丈夫？", "pains": "例：続けられるか不安／子どもに合うかわからない", "shooting": "例：レッスン中の手元・作品・教室の様子。生徒の顔は許可をとる", "strengths": "例：少人数・先生の人柄・通いやすい時間"}, "creative": {"target": "例：SNSやホームページに手が回らない個人事業主", "faqs": "例：何から頼めばいい？／予算が少なくても相談できる？", "pains": "例：何を発信すればいいかわからない／業者に頼むのが不安", "shooting": "例：作業中の画面・制作物・打ち合わせの手元", "strengths": "例：まとめて任せられる・話しやすさ・仕上がりの統一感"}}};
const QUESTIONS = LISTEN.questions;
function hintFor(q, industry) {
  const key = (LISTEN.industries.find(([, words]) => words.some(w => (industry || "").includes(w))) || [""])[0];
  return ((LISTEN.hints[key] || {})[q.id]) || q.hint;
}
const isDbShop = shop => shop.startsWith("db:");
const shopDoc = shop => dbShops.find(d => "db:" + d.id === shop);

function shopData(shop) {
  if (SHOPS[shop]) return SHOPS[shop];
  const d = shopDoc(shop) || {};
  const k = d.karte || {};
  return {
    name: d.business_name || "新しいお店", industry: d.industry || "", area: d.area || "", tone: d.tone || "",
    site: "", template: false, priceLabel: "通常", priceConfirmed: (d.created || "").slice(0, 10),
    karte: KARTE_ROWS.map(key => key === "tone" ? ["話し方", "チャット", d.tone || ""] : [SECTION_LABEL[key], "チャット", (k[key] || []).join("／")]),
    services: (d.services || []).map(s => [s.name, s.status === "paused" ? "休止中" : "受付中", s.note || ""]),
    prices: (d.prices || []).map(p => [p.service, p.menu, p.amount, p.regular ?? null, p.remaining ?? null]),
    faqs: d.faqs || [],
  };
}

function answered(d, q) {
  if (q.id === "basics") return !!(d.business_name && d.industry);
  if (q.id === "tone") return !!d.tone;
  if (q.id === "services") return (d.services || []).length > 0;
  if (q.id === "faqs") return (d.faqs || []).length > 0;
  return ((d.karte || {})[q.target] || []).length > 0;
}
function currentQuestion(d) {
  return QUESTIONS.find(q => !(d.asked || []).includes(q.id) && !answered(d, q)) || null;
}

async function startNewShop() {
  if (!db) return;
  const now = new Date().toISOString();
  const ref = await db.collection("shops").add({ created: now, business_name: "", industry: "", area: "", tone: "",
    karte: {}, services: [], faqs: [], prices: [], asked: [], followup: null, log: [] });
  state.shop = "db:" + ref.id; state.view = "chat"; state.editing = ""; saveUi(); render();
}

  <div class="chat">
    ${!done ? `<div class="msg"><div>はじめまして。投稿の材料になる「想いカルテ」を作るために、${QUESTIONS.length}個だけ質問します。わからないところは「あとで答える」で飛ばせます。答えやすいものから聞きます。答えはあとからサービス情報で直せます。</div><span class="small" style="background:var(--warn-soft);padding:8px 10px;border-radius:8px">${esc(LISTEN.methods.sheet.note)}</span></div>` : ""}
    ${(d.log || []).map(m => m.who === "me" ? `<div class="mine">${esc(m.text)}</div>`
      : `<div class="msg">${m.why ? `<span class="why">${esc(m.why)}</span>` : ""}<div>${esc(m.text)}</div>${m.list ? `<ul class="small">${m.list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>`).join("")}
    ${working.has(state.shop) ? `<div class="msg"><span class="why">カルテに入れています…</span><div>答えを整えています。少し待ってください。</div></div>` : ""}
    ${q && !working.has(state.shop) ? `<div class="msg"><span class="why">${esc(fu ? "もう一歩だけ聞かせてください" : q.why)}</span><div>${esc(fu ? fu.question : q.ask)}</div>
      ${fu && fu.choices.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${fu.choices.map(c => `<button class="btn ghost" type="button" data-choice="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
      ${!fu && hintFor(q, d.industry) ? `<span class="small muted">${esc(hintFor(q, d.industry))}</span>` : ""}
      <form class="answers" id="listenForm">
        <textarea id="listen-${state.shop}-${q.id}" aria-label="答え" placeholder="ここに答えを書く（音声入力でも大丈夫です）"></textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit" ${sample ? "" : "disabled"}>答える</button><button class="btn ghost" type="button" data-skip="${q.id}">あとで答える</button></div>
        ${sample ? "" : '<span class="status">この画面ではAIが使えないため、答えを入れられません。</span>'}
      </form></div>` : ""}
    ${!q ? `<div class="msg"><span class="why">聞き取りが終わりました</span><div>ありがとうございました。カルテができました。サービス情報で確認・修正できます。料金は、サービス情報の料金表に入れてください。</div>

async function listenAnswer(text, viaChoice) {
  const d = shopDoc(state.shop); if (!d || !sample) return;
  const q = currentQuestion(d); if (!q) return;
  const shopId = state.shop, ref = db.collection("shops").doc(d.id);
  const fuUsed = !!(d.followup && d.followup.qid === q.id) || viaChoice;
  const log = [...(d.log || []), { who: "app", why: q.why, text: d.followup && d.followup.qid === q.id ? d.followup.question : q.ask }, { who: "me", text }];
  working.add(shopId); render(true);
  const prompt = `お店の「想いカルテ」を作るために聞き取りをしています。答えをカルテに入れる形に整えてください。

# 守ること
- 答えに書かれていることだけを入れる。言い換えて短く整えるのはよいが、付け足さない。
- 料金・割引の数字は入れない（料金は料金表に入れてもらう）。
- 実績・お客様の声（achievements）には、出た結果と実際にもらった言葉だけ。「まだ」「これから」は入れない。
- この質問で埋めたい場所は「${q.target}」。ほかの項目に当てはまることが書かれていたら、そちらに入れてよい。
- ${fuUsed ? "followup は入れない（もう一歩はすでに聞いた）。" : "答えが短すぎて材料にならないときだけ、followup に選択肢を3〜4つ付けた質問を1つ入れる。「なし」「まだ」「わからない」とはっきり答えているときは入れない。"}
- reply_to_owner：短いお礼（です・ます）。何を入れたかを1文で。

# 質問
${q.why}${q.ask}
${d.followup && d.followup.qid === q.id ? "（もう一歩：" + d.followup.question + "）" : ""}

# 答え
${text}

# お店（わかっているところまで）
${d.business_name || "（名前まだ）"}／${d.industry || "（業種まだ）"}

次の形のJSONだけで答えてください。section は ${Object.keys(SECTION_LABEL).join(" / ")} のどれか。
{"facts":[{"section":"philosophy","text":"…"}],"basics":{"business_name":"","industry":"","area":"","tone":""},"services":[{"name":"…","note":"","status":"active"}],"faqs":[{"question":"…","answer":"…"}],"followup":null,"reply_to_owner":"…"}`;
  try {
    const out = await sample.json(prompt, { cache: false });
    const upd = { log, followup: null };
    const added = [];
    const b = out && typeof out.basics === "object" && out.basics ? out.basics : {};
    for (const key of ["business_name", "industry", "area", "tone"]) if (typeof b[key] === "string" && b[key].trim()) { upd[key] = b[key].trim(); added.push(b[key].trim()); }
    const karte = JSON.parse(JSON.stringify(d.karte || {}));
    for (const f of Array.isArray(out?.facts) ? out.facts : []) {
      const key = String(f.section || ""), t = String(f.text || "").trim();
      if (!SECTION_LABEL[key] || !t || PRICE_RE.test(t)) continue;
      karte[key] = [...(karte[key] || []), t].filter((v, i, a) => a.indexOf(v) === i); added.push(t);
    }
    upd.karte = karte;
    const services = [...(d.services || [])];
    for (const s of Array.isArray(out?.services) ? out.services : []) {
      const name = String(s.name || "").trim();
      if (name && !PRICE_RE.test(name) && !services.some(x => x.name === name)) { services.push({ name, note: String(s.note || "").trim(), status: s.status === "paused" ? "paused" : "active" }); added.push(name); }
    }
    upd.services = services;
    const faqs = [...(d.faqs || [])];
    for (const f of Array.isArray(out?.faqs) ? out.faqs : []) {
      const qq = String(f.question || "").trim(), aa = String(f.answer || "").trim();
      if (qq && aa && !PRICE_RE.test(aa)) { faqs.push({ question: qq, answer: aa }); added.push(qq); }
    }
    upd.faqs = faqs;
    const fu = out && out.followup && typeof out.followup === "object" && out.followup.question ? out.followup : null;
    if (fu && !fuUsed) upd.followup = { qid: q.id, question: String(fu.question), choices: (Array.isArray(fu.choices) ? fu.choices : []).slice(0, 4).map(String) };
    else upd.asked = [...(d.asked || []), q.id];
    if (out?.reply_to_owner) upd.log = [...log, { who: "app", text: String(out.reply_to_owner) }];
    await ref.update(upd);
  } catch (err) {
    try { await ref.update({ log: [...log, { who: "app", why: "うまく入れられませんでした", text: "もう一度答えるか、「あとで答える」で次に進んでください。" }] }); } catch (e) {}
  } finally { working.delete(shopId); render(true); }
}

document.addEventListener("submit", async e => {
  if (e.target.id !== "priceAdd") return;
  e.preventDefault();
  const d = shopDoc(state.shop); if (!d || !db) return;
  const menu = $("#pa-menu").value.trim(), amount = Math.round(Number($("#pa-amount").value)), reg = $("#pa-regular").value;
  if (!menu || !(amount >= 0) || $("#pa-amount").value === "") return;
  try {
    await db.collection("shops").doc(d.id).update({ prices: [...(d.prices || []), { service: $("#pa-svc").value, menu, amount, regular: reg === "" ? null : Math.round(Number(reg)), remaining: null }] });
    for (const id of ["#pa-menu", "#pa-amount", "#pa-regular"]) { const el = $(id); if (el) el.value = ""; }
  } catch (err) {}
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-method]");
  if (!b || !db) return;
  const d = shopDoc(state.shop); if (!d) return;
  try {
    await db.collection("shops").doc(d.id).update({ method: b.dataset.method });
    if (b.dataset.method === "meet") await db.collection("listening_requests").add({ shop: d.id, at: new Date().toISOString() });
  } catch (err) {}
});
document.addEventListener("submit", e => {
  if (e.target.id !== "listenForm") return;
  e.preventDefault();
  const ta = e.target.querySelector("textarea"), text = ta.value.trim();
  if (text) listenAnswer(text, false);
});
document.addEventListener("click", async e => {
  const c = e.target.closest("[data-choice]");
  if (c) { listenAnswer(c.dataset.choice, true); return; }
  const sk = e.target.closest("[data-skip]");
  if (sk && db) {
    const d = shopDoc(state.shop); if (!d) return;
    try { await db.collection("shops").doc(d.id).update({ asked: [...(d.asked || []), sk.dataset.skip], followup: null }); } catch (err) {}
  }
});

const slotId = (postId, fmt, shot) => `${postId}__${fmt}__${shot}`;
const slotDoc = (postId, fmt, shot) => media.find(m => m.id === slotId(postId, fmt, shot));
const seenAdd = (cur, x) => { const s = [...((cur && cur.seen) || [])]; if (x && x.asset && !s.some(y => y.asset === x.asset)) s.push({ asset: x.asset, kind: x.kind }); return s.slice(-20); };   // その場面に入れたことのある素材（戻したあとも「前の素材」に残す）
async function setSlot(postId, fmt, shot, next) {
  const cur = slotDoc(postId, fmt, shot), hist = [...((cur && cur.hist) || [])];
  if (cur && cur.asset) hist.push({ asset: cur.asset, kind: cur.kind });
  const doc = { post: postId, format: fmt, shot, asset: next ? next.asset : "", kind: next ? next.kind : "", hist: hist.slice(-5), seen: seenAdd(cur, next), at: new Date().toISOString() };
  await db.collection("media").doc(slotId(postId, fmt, shot)).set(doc);
  const k = media.findIndex(m => m.id === slotId(postId, fmt, shot)); if (k >= 0) media[k] = { id: slotId(postId, fmt, shot), ...doc }; else media.push({ id: slotId(postId, fmt, shot), ...doc });
}
async function undoSlot(postId, fmt, shot) {
  const cur = slotDoc(postId, fmt, shot); if (!cur || !(cur.hist || []).length) return;
  const hist = [...cur.hist], back = hist.pop();
  const doc = { ...cur, asset: back.asset, kind: back.kind, hist, at: new Date().toISOString() }; delete doc.id;
  await db.collection("media").doc(cur.id).set(doc); Object.assign(cur, doc);
}

# 守ること
- 書いてよい事実は【材料】にあることだけ。材料にない実績・数字・約束・サービスは書かない。
- 1本の投稿で伝えることは【テーマ】の1つだけ。関係ない材料やサービス一覧を付け足さない。

- 言わないこと：
${ng}
- 「必ず」「絶対」「No.1」などの言い過ぎの言葉は使わない。絵文字は使わない。
- 材料の「できるだけ」「原則」などの条件は、動画内の文字で短くするときも削らない。入りきらないときは別の言い方にする。

# 判断の考え方（決まりではなく、場面ごとに考えるための手がかり）
材料をぜんぶ使う必要はない。読む人の立場で、入れる・省くを決める。下の例をそのまま当てはめず、今回の場面で考える。
${ENGINE.judgment}

# 書く前に決めること（plan）
- 読む人はどんな人か、その人がいちばん知りたいことは何か。
- 材料のうち何を入れて、何を省くか。それぞれ理由を短く。入れることは、先に書くものから順に並べる。

# 投稿文の組み立て
1. 1行目：材料に「ターゲットの悩み」があるときは、その悩みを読む人の言葉で（「」を使ってもよい）。
   悩みが材料にないときは、「」の声で始めず、テーマで伝えることから書き始める。材料にない声や気持ちを作らない。
2. 答え・核心を短く
3. 材料にある具体的なことを1〜2つ
4. やわらかい行動の呼びかけ（締めの案内は自動で付くので書かなくてよい）
- 1文は短く。2〜3文ごとに空行を入れる。本文は300文字前後まで。

# 動画内の文字（場面）
- 場面の数は3〜10。伝えることの量に合わせて決める。動画の長さは決まっていない（読める時間で決まる）。
  短くするために伝えるべきことを削らない。ただし同じことを繰り返して引き延ばさない。
- 最初の場面：手を止めさせる一言（問いかけ・共感）。最後の場面：行動の呼びかけ、または余韻。あいだ：伝えることを1場面に1つ。
- 1つの場面は「見出し→補足」の形にしてもよい（「→」で区切る）。見出しは${ENGINE.maxScene}文字以内、補足は45文字以内。補足には理由・やり方・具体的なことを入れる。
- 投稿文のいいところ（理由・具体的なこと・読む人の得）を多めに拾う。結論だけに縮めない。投稿文の言葉を活かしてよい。
  ただし投稿文を全部そのまま並べるのではなく、動画で伝えたいところを選ぶ。動画の文字は投稿文の35%以上にする。
- 1行で書く。

- 固定タグ：${K.hashtags.join(" ") || "なし"}（必ず含める）
- 合計${ENGINE.maxTags}個以内。テーマに関係するものだけ。`;
}

function priceBlock(K, serviceId) {
  const svName = serviceId ? (K.services.find(s => s.id === serviceId) || {}).name : null;

/* 動画の文字を整える（checks.tidy_scenes と同じ）：空を消す・「→」は2つまで・多すぎる場面はあいだをまとめる。最初と最後は残す */
function tidyScenes(scenes, needed) {
  let out = scenes.map(x => String(x).split(/\s+/).join(" ").trim()).filter(Boolean).map(x => {
    const ps = x.split("→").map(y => y.trim()).filter(Boolean); return (ps.length > 3 ? [...ps.slice(0, 2), ps.slice(2).join("")] : ps).join("→"); });
  const limit = needed || 10;
  while (out.length > limit && out.length > 3) {
    const mids = out.slice(1, -1).map((x, i) => [x.length, i + 1]).sort((a, b) => a[0] - b[0]);
    const k = mids[0][1]; let [a, b] = k + 1 < out.length - 1 ? [k, k + 1] : [k - 1, k]; if (a === 0) [a, b] = [1, 2];
    const h = out[a].split("→");
    out[a] = h.length >= 2 ? [...h.slice(0, 2), (h.slice(2).join(" ") + " " + out[b].replace(/→/g, " ")).trim()].join("→") : out[a] + "→" + out[b].replace(/→/g, " ");
    out.splice(b, 1);
  }
  return out;
}

  if (body.split(MARK).join("").length > maxBody) P.push(`投稿文が長すぎます。${maxBody}文字以内にしてください。`);
  if (PRICE_RE.test(ai.split(MARK).join(""))) P.push(`料金・割引の数字を書かないでください。料金を入れる場所には ${MARK} とだけ書いてください。`);

  if (body.split("\n").some(l => l.includes(MARK) && l.trim() !== MARK)) P.push(`${MARK} は文の途中に入れず、それだけで1行にしてください。`);
  if (body.split(MARK).length > 2) P.push(`${MARK} は1回だけにしてください。`);

    const c = cuts(lv).filter(x => fits(x) && x >= Math.ceil(per / 2));   // 1行目が短すぎる切り方（「も／ちろん」）はしない
    if (c.length) { const cut = Math.max(...c); return text.slice(0, cut).trim() + "\n" + wrapJp(text.slice(cut).trim(), per); }

function captionScenes(p) {

  const out = [];
  body.forEach((para, i) => {
    const lines = para.split("\n").map(x => x.trim()).filter(Boolean);
    if (/^Q[.．]/.test(lines[0]) && lines.some(l => /^A[.．]/.test(l))) {
      const q = lines[0].replace(/^Q[.．]\s*/, ""), a = sent(lines.slice(1).join("").replace(/^A[.．]\s*/, ""));
      out.push([q, a[0], a.slice(1).join("")].filter(Boolean).join("→")); return;
    }
    if (/^【/.test(lines[0])) { out.push([lines[0], lines.slice(1).join(" ")].filter(Boolean).join("→")); return; }   // 料金の表
    const ss = sent(para);
    if (i === 0) { out.push(ss[0]); if (ss.length > 1) out.push(ss.slice(1).length > 1 ? ss[1] + "→" + ss.slice(2).join("") : ss[1]); return; }
    if (i === body.length - 1 && ss.length > 1) { out.push(ss.slice(0, -1).length > 1 ? ss[0] + "→" + ss.slice(1, -1).join("") : ss[0]); out.push(ss[ss.length - 1]); return; }
    out.push(ss.length > 1 ? ss[0] + "→" + ss.slice(1).join("") : ss[0]);
  });
  return out.map(x => x.replace(/^「(.*)」$/, "$1")).slice(0, 12);
}

        const amount = num(`ed-${shop}-pa-${i}`);
        if (amount == null) { sv.disabled = false; return; }
        await db.collection("karte_edits").doc(`${shop}__price__${i}`).set({ shop, type, idx: i, menu: shopData(shop).prices[i][1], amount, regular: num(`ed-${shop}-pr-${i}`), remaining: num(`ed-${shop}-pm-${i}`), at });
      }
    }
    state.editing = "";
    render(true);
  } catch (err) { sv.disabled = false; }
});
document.addEventListener("change", async e => {
  const sel = e.target.closest("[data-svc]");
  if (!sel || !db) return;
  const i = Number(sel.dataset.svc), shop = state.shop;
  try { await db.collection("karte_edits").doc(`${shop}__svc__${i}`).set({ shop, type: "svc", idx: i, service: shopData(shop).services[i][0], status: sel.value, at: new Date().toISOString() }); } catch (err) {}
});

/* 返事をAIがカルテ向けの文に整えて、そのまま入れる（2026-10-25 決定：確認なし） */
async function toKarte(ref, shop, topicId, text) {
  if (!sample) return;
  const s = karteNow(shop);
  const t = CHAT_TOPICS[shop].find(t => t.id === topicId);
  const question = t.q + (t.list ? "（" + t.list.join("／") + "）" : "");
  const items = s.karte.map(r => r[0]);
  const prompt = `「${s.name}」（${s.industry}）のカルテに、お知らせチャットの返事を入れます。

# 守ること
- 返事に書かれていることだけを入れる。言い換えて短く整えるのはよいが、付け足さない。
- すでにカルテにあることは入れない（同じ内容の言い直しも入れない）。
- 料金・割引の数字は入れない。料金の変更に触れていたら price_change_mentioned を true にする。
- 「実績・お客様の声」には、出た結果と、お客様から実際にもらった言葉だけを入れる。「まだない」「これから」「募集中」は入れない。
- サービスの休止・再開がはっきり書かれていたら service_changes に入れる（status は「受付中」か「休止中」）。
- 入れるものがなければ facts は空でよい。
- reply_to_owner：返事をくれた人への短いお礼（です・ます）。何を入れたか、入れなかったものはその理由を1〜2文で。

# 聞いた質問
${question}

# 返事
${text}

# 今のカルテ
${s.karte.map(r => `【${r[0]}】${r[2] || "（空）"}`).join("\n")}
【サービス】${s.services.map(r => `${r[0]}（${r[1]}）`).join("／")}

次の形のJSONだけで答えてください。item は ${items.map(i => `「${i}」`).join("")} のどれか。
{"facts":[{"item":"強み","text":"…"}],"service_changes":[{"name":"SNS運用","status":"受付中"}],"price_change_mentioned":false,"reply_to_owner":"…"}`;
  working.add(ref.id); render(true);
  try {
    const out = await sample.json(prompt, { cache: false });
    const facts = (Array.isArray(out?.facts) ? out.facts : [])
      .map(f => ({ item: String(f.item || ""), text: String(f.text || "").trim() }))
      .filter(f => items.includes(f.item) && f.text);
    const skipped = facts.filter(f => PRICE_RE.test(f.text)).map(f => "料金の数字が入っていたので入れませんでした：" + f.text);
    const services = (Array.isArray(out?.service_changes) ? out.service_changes : [])
      .map(c => ({ name: String(c.name || ""), status: String(c.status || "") }))
      .filter(c => s.services.some(r => r[0] === c.name && r[1] !== c.status) && ["受付中", "休止中"].includes(c.status));
    if (out?.price_change_mentioned) skipped.push("料金の変更は、数字をまちがえないよう、サービス情報の料金表で直接直してください。");
    await db.collection("karte_updates").add({ shop, topic: topicId, chat: ref.id, at: new Date().toISOString(),
      facts: facts.filter(f => !PRICE_RE.test(f.text)), services, skipped, reply: String(out?.reply_to_owner || "") });
  } catch (err) {
    const msg = err && err.code === "not_granted" ? "AIの利用が許可されていないため、カルテに入れられませんでした。ロズが手で入れます。"
      : "AIにつながりませんでした。ロズが手で入れます。";
    try { await ref.update({ error: msg }); } catch (e) {}
  } finally { working.delete(ref.id); render(true); }
}

document.addEventListener("click", async e => {
  const n = e.target.closest("[data-none]");
  if (!n || !db) return;
  try { const ref = await db.collection("chat").add({ shop: state.shop, topic: n.dataset.none, text: "全部なし", at: new Date().toISOString() }); toKarte(ref, state.shop, n.dataset.none, "全部なし"); } catch (err) {}
});

if (!SHOPS[state.shop]) state.shop = "yorozu";
// AIで作った投稿（g-…）は db から後で届くので、最初の時点で見つからなくても1本目に戻さない（戻すとテーマもよくある質問に変わってしまう）
if (state.post && !state.post.startsWith("g-") && !shopPosts().some(p => p.id === state.post)) state.post = (shopPosts()[0] || {}).id || "";
render();
</script>

<style>
/* はじめての案内（フィルモが画面を指さして説明する。2026-11-05 真由美さん） */
#tour { position: fixed; inset: 0; z-index: 9000; pointer-events: none; }
#tour .t-hole { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(30, 22, 14, .62); transition: all .25s ease; pointer-events: none; outline: 3px solid var(--accent); }
#tour .t-hole.none { left: 50%; top: 40%; width: 0; height: 0; outline: 0; }
#tour .t-card { position: fixed; left: 50%; transform: translateX(-50%); width: min(460px, calc(100% - 24px)); display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
#tour .t-card.bottom { bottom: max(14px, env(safe-area-inset-bottom)); }
#tour .t-card.top { top: max(14px, env(safe-area-inset-top)); }
#tour .t-chara { width: 76px; height: 76px; flex: none; object-fit: contain; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); padding: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
#tour .t-bubble { flex: 1; background: var(--surface); color: var(--ink); border: 3px solid var(--accent); border-radius: 20px 20px 20px 6px; padding: 12px 14px; font-size: 15px; line-height: 1.7; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
#tour .t-bubble b { color: var(--accent); }
#tour .t-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
#tour .t-row small { color: var(--muted); margin-right: auto; }
#tour .t-row button { font: inherit; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 6px 14px; border: 0; cursor: pointer; }
#tour .t-next { background: var(--accent); color: #fff; }
#tour .t-back, #tour .t-skip { background: var(--sunken); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { #tour .t-hole { transition: none; } }
</style>
<script>
(function () {
  const KEY = "filmo-tour-done";
  const go = (view, mode) => () => { state.view = view; if (mode) state.makeMode = mode; saveUi(); render(); };
  const STEPS = [
    { text: "はじめまして！<b>フィルモ</b>です🎬<br>お店のインスタのリール動画を、いっしょに作るお手伝いをします。使い方を少しだけ案内しますね。" },
    { el: "#shopSel", text: "ここで<b>お店を選びます</b>。お試しでは「YOROZU」と、架空のパン屋さん「こむぎと日々」が入っています。" },
    { el: '[data-view="info"]', before: go("info"), text: "<b>サービス情報</b>には、お店のことがまとめてあります。投稿の文章は、<b>ここに書いてあることだけ</b>で作ります。情報が多いほど、いい文章になりますよ。" },
    { el: ".easy-steps .step", before: go("make", "easy"), text: "<b>動画作成</b>では、まず「どんな動画を作るか」を選びます。よくある質問、想い・理念、サービス紹介…など。タイトルを自分で決める「自由に作る」もあります。" },
    { el: "[data-generate]", text: "選んだら<b>「作ってもらう」</b>を押すだけ！1〜2分で、投稿文と動画ができあがります。写真がなくても、絵と文字のアニメーションで作れます。" },
    { el: ".mode-tabs", text: "もっと細かく直したいときは<b>「こだわって直す」</b>へ。文字・音楽・ナレーション・絵を、自分で変えられます。" },
    { el: '[data-view="hist"]', text: "作った動画は<b>作成履歴</b>にたまります。いらないものは、選んで消せます。" },
    { el: ".dm-fab", text: "使いにくいところがあったら、ここに書いて送ってください。<b>アプリをよくするのに使います！</b>", optional: true },
    { text: "案内はここまでです。<b>さっそく作ってみましょう！</b><br><small>この案内は「設定」からもう一度見られます。</small>", last: true },
  ];
  let i = 0, box = null;
  const visible = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
  function steps() { return STEPS.filter(s => !s.optional || document.querySelector(s.el)); }
  function draw() {
    const list = steps(), st = list[i]; if (!st) return end();
    if (st.before && !st.done) { st.done = true; st.before(); return setTimeout(draw, 120); }
    const el = st.el && [...document.querySelectorAll(st.el)].find(visible);
    if (el) el.scrollIntoView({ block: "center", behavior: "instant" in document.documentElement.style ? "instant" : "auto" });
    requestAnimationFrame(() => {
      const hole = box.querySelector(".t-hole"), card = box.querySelector(".t-card");
      if (el) { const r = el.getBoundingClientRect(), pad = 6;
        Object.assign(hole.style, { left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" }); hole.classList.remove("none");
        card.className = "t-card " + (r.top + r.height / 2 > innerHeight * 0.55 ? "top" : "bottom");
      } else { hole.removeAttribute("style"); hole.classList.add("none"); card.className = "t-card bottom"; }
      box.querySelector(".t-bubble div").innerHTML = st.text;
      box.querySelector(".t-count").textContent = `${i + 1} / ${list.length}`;
      box.querySelector(".t-back").hidden = i === 0;
      box.querySelector(".t-skip").hidden = !!st.last;
      box.querySelector(".t-next").textContent = st.last ? "はじめる" : i === 0 ? "案内を見る" : "次へ";
    });
  }
  function end() { try { localStorage.setItem(KEY, "1"); } catch (e) {} if (box) box.remove(); box = null; STEPS.forEach(s => delete s.done); go("make", "easy")(); }
  window.startTour = () => {
    if (box) return; i = 0; STEPS.forEach(s => delete s.done);
    box = document.createElement("div"); box.id = "tour";
    box.innerHTML = `<div class="t-hole none"></div><div class="t-card bottom" role="dialog" aria-label="フィルモの案内"><img class="t-chara" src="anim/filmo.webp" alt="フィルモ">
      <div class="t-bubble"><div></div><div class="t-row"><small class="t-count"></small><button class="t-skip" type="button">とばす</button><button class="t-back" type="button">戻る</button><button class="t-next" type="button">次へ</button></div></div></div>`;
    document.body.appendChild(box);
    box.querySelector(".t-next").onclick = () => { i++; draw(); };
    box.querySelector(".t-back").onclick = () => { i = Math.max(0, i - 1); const s = steps()[i]; if (s) delete s.done; draw(); };
    box.querySelector(".t-skip").onclick = end;
    draw();
  };
  addEventListener("resize", () => { if (box) draw(); });
  document.addEventListener("click", e => { if (e.target.closest("[data-tour-start]")) startTour(); });
  // はじめて開いたときだけ。合言葉の入口（お試し版）が出ている間は待つ
  const seen = () => { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return true; } };
  if (!seen()) { const t = setInterval(() => { if (!document.getElementById("gate") && document.querySelector("#nav button")) { clearInterval(t); setTimeout(startTour, 500); } }, 400); }
})();
</script>
